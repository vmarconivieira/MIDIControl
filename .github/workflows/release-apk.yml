name: Build & Release P61x Console APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publicar GitHub Release com o APK anexado'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Read version.json
        id: meta
        run: |
          VERSION_NAME=$(python3 -c "import json; print(json.load(open('version.json'))['versionName'])")
          VERSION_CODE=$(python3 -c "import json; print(json.load(open('version.json'))['versionCode'])")
          TAG=$(python3 -c "import json; print(json.load(open('version.json')).get('tag', 'v' + json.load(open('version.json'))['versionName']))")
          APK_NAME=$(python3 -c "import json; d=json.load(open('version.json')); print(d.get('apkFileName', f'P61x_Console_v{d[\"versionName\"]}.apk'))")
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          python3 -c "import json; notes=json.load(open('version.json')).get('notes', []); print('\n'.join(f'- {n}' for n in notes) if isinstance(notes, list) else str(notes))" > release_notes.md

      - name: Decode Android Keystore (if configured in Secrets)
        id: ks
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/p61x_release.jks"
            echo "ks_path=$RUNNER_TEMP/p61x_release.jks" >> "$GITHUB_OUTPUT"
            echo "signed_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret nao configurado! Usando chave temporaria (configure o secret para atualizacoes in-place no celular)."
            echo "ks_path=" >> "$GITHUB_OUTPUT"
            echo "signed_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & Verify APK
        env:
          KEYSTORE_PATH: ${{ steps.ks.outputs.ks_path }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          chmod +x scripts/build_apk.sh
          ./scripts/build_apk.sh "dist/${{ steps.meta.outputs.apk_name }}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: P61x-Console-v${{ steps.meta.outputs.version_name }}
          path: dist/${{ steps.meta.outputs.apk_name }}
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.meta.outputs.tag }}
          name: P61x Console v${{ steps.meta.outputs.version_name }}
          body_path: release_notes.md
          files: dist/${{ steps.meta.outputs.apk_name }}
          make_latest: true
